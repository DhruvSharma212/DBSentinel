name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend and agent tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            agent/requirements-dev.txt
      - name: Install
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r agent/requirements-dev.txt
      - name: Backend tests
        run: python -m pytest backend -q
      - name: Agent tests
        run: python -m pytest agent -q

  agent-windows:
    name: Agent tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r agent/requirements.txt pytest fastapi httpx
      - name: Agent tests (PostgreSQL tests are skipped here)
        run: python -m pytest agent -q

  frontend:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
